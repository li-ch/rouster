[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/rib",
    "crates/sav",
    "crates/netlink-dp",
    "crates/zapi",
    "crates/rousterd",
]

[workspace.package]
version = "0.0.0"
edition = "2021"

[workspace.dependencies]
common = { path = "crates/common" }
rib = { path = "crates/rib" }
sav = { path = "crates/sav" }
netlink-dp = { path = "crates/netlink-dp" }
zapi = { path = "crates/zapi" }

bytes = "1"
futures = "0.3"
ipnet = "2"
libc = "0.2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
rtnetlink = "0.18"
netlink-packet-route = "0.25"
