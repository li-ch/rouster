# Phase 0 smoke topology: a single Rouster node.
#
# Build the image first:  docker build -t rouster:local -f docker/Dockerfile .
# Deploy:                 containerlab deploy -t topologies/phase0-static.clab.yml
# Verify:                 docker exec clab-rouster-phase0-r1 ip route

name: rouster-phase0

topology:
  nodes:
    r1:
      kind: linux
      image: rouster:local

