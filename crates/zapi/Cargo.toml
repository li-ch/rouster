[package]
name = "zapi"
description = "Rouster ZAPI codec and server: FRR zebra-protocol interop edge"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
common.workspace = true
bytes.workspace = true
thiserror.workspace = true
# io-util (AsyncReadExt/AsyncWriteExt) is additive on top of the workspace
# feature set; needed by the zapi-sniff debug binary's socket loop.
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true

# E7 codec micro-benchmarks (docs/benchmarks.md D2: criterion on zapi
# first — the tokio-test-util precedent: dev-dep, reviewable).
[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "zapi_codec"
harness = false
