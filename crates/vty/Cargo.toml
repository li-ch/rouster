[package]
name = "vty"
description = "Rouster vtysh-compatible VTY server - Cisco-style show/config surface"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# The run-dir status reader (N8 consolidation): a pre-existing
# workspace member, std-only — no new external crates, no new lock
# entries beyond this package's own dependency edges.
common.workspace = true
# io-util ( AsyncReadExt/AsyncWriteExt for the line discipline) is
# added here on top of the workspace's feature set — same crate,
# same lock entry, no workspace-file change.
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true
thiserror.workspace = true
# Thin binary wiring (log output), the savd/bfdd shape: a
# pre-existing workspace member — no new crates, no new lock
# entries beyond the vty package's own dependency edges.
tracing-subscriber.workspace = true
# S11-a M5: the session config tree is a yang::DataTree bound to
# the embedded rouster-vty model — the translator seam (invariant
# 5). A pre-existing workspace member; no new external crates.
yang = { path = "../yang" }
