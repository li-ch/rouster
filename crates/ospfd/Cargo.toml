[package]
name = "ospfd"
description = "Rouster OSPFv2 - AF-generic IGP (Phase 3)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
common = { workspace = true }
zapi = { workspace = true }
socket2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
# The audited v6 cmsg read-back (AGENTS.md's owner-named exception,
# 2026-10-14): socket2 0.6.5 exposes no IPV6_RECVPKTINFO setter, so
# transport::arm_v6_recv_pktinfo makes the one audited libc::setsockopt
# call (the bfdd arm_v4_recv_ttl precedent). Pre-existing workspace
# member dep (bfdd, netlink-dp) — no new crate enters the lockfile.
libc.workspace = true
# The SAVNET agent hooks (experimental-savnet, default OFF): in-process
# reporting of SAV-relevant events (changed LSAs from the
# InstallAndFlood products, adjacency transitions) to a
# sav::agent::SavAgent. Optional path-dep on the pre-existing
# workspace member (the bgpd/rpki precedent); the feature forwards
# into sav so the cfg-gated agent items exist when the hooks compile.
sav = { workspace = true, optional = true }

[features]
# See docs/protocols/savnet.md: in-process hooks only, no wire
# protocols; default OFF (the default workspace gate exercises none of
# it, and feature-off compiles zero hooks).
experimental-savnet = ["dep:sav", "sav/experimental-savnet"]
