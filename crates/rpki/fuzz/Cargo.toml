[package]
name = "rpki-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.rpki]
path = ".."

# Independent workspace: the fuzz crate builds outside the Rouster
# workspace (no root-manifest membership; the codec crates' workspace
# inheritance resolves through their own root manifest).
[workspace]
members = ["."]

[[bin]]
name = "rtr_pdu_decode"
path = "fuzz_targets/rtr_pdu_decode.rs"
test = false
doc = false
bench = false
