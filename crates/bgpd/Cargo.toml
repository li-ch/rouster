[package]
name = "bgpd"
description = "Rouster bgpd — see docs/architecture.md and the Phase-2 plan"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
policy = { workspace = true }
common = { workspace = true }
# W2-d (M2): the VRP/ASPA tables + verify functions for ROV/OTC/ASPA
# in the decision path. Pre-existing workspace member, path-only
# dependency (the root workspace file is intentionally untouched —
# same crate, no new crates, no new lock entries beyond bgpd's own
# edge list; the zapi/tracing-subscriber W8 precedent).
rpki = { path = "../rpki" }
# io-util (AsyncReadExt/AsyncWriteExt) additive like zapi's; the
# session loop's framing is read_exact/write_all based.
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true
thiserror.workspace = true
zapi = { workspace = true }
tracing-subscriber = { workspace = true }
# The SAVNET agent hooks (experimental-savnet, default OFF): in-process
# reporting of SAV-relevant session events to a sav::agent::SavAgent.
# Optional path-dep on the pre-existing workspace member (the rpki
# precedent); the feature forwards into sav so the cfg-gated agent
# items exist when the anchor hooks compile.
sav = { workspace = true, optional = true }
# S15-b (2026-10-16): the owner-ratified allocator A/B — mimalloc as
# an OPTIONAL dep behind `alloc-mimalloc`, default OFF, bgpd only (the
# D2 one-crate-first pattern). Dep tree delta (disclosed in the §R
# entry): mimalloc 0.1.52 + libmimalloc-sys 0.1.49 (C, cc-built, no
# transitive runtime deps; musl-static compatible). Without the
# src-side cfg-gated `#[global_allocator]` activation point (3 lines,
# quoted in the §R entry) the dep compiles but is linker-discarded —
# the feature-off default build links nothing new either way.
mimalloc = { version = "0.1.52", optional = true }

[features]
# See docs/protocols/savnet.md: in-process hooks only, no wire
# protocols; default OFF (the default workspace gate exercises none of
# it, and feature-off compiles zero hooks).
experimental-savnet = ["dep:sav", "sav/experimental-savnet"]
# PERF-M1 M1: the memory census — a deep-size walker over the RIB that
# names the per-structure consumers (attrs, maps, duplication factor)
# at table milestones. Default OFF and inert at runtime unless
# BGPD_MEM_CENSUS=1 is set in the daemon's environment; the receipts'
# headline RSS numbers come from feature-off clean runs (the census
# walk's own transients are disclosed in the census-mode logs).
mem-census = []
# S15-b: opting in swaps bgpd's global allocator to mimalloc once the
# src-side activation point (cfg-gated on this feature, in the bgpd
# bin) lands; the measured A/B and the adoption/decline decision are
# the §R allocator A/B entry (2026-10-16).
alloc-mimalloc = ["dep:mimalloc"]

# start_paused tokio tests + duplex sockets, dev-only (sav precedent).
[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
