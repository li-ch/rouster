[package]
name = "configd"
description = "Rouster config manager - transactional compose/validate/apply across daemons (Phase 4 opener)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
common = { workspace = true }
yang = { path = "../yang" }
# io-util: the AsyncRead/WriteExt extension traits the restconf
# HTTP/1.1 core needs (the vty crate's exact precedent — a feature
# of the workspace tokio, not a new dependency).
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
yang = { path = "../yang" }
