[package]
name = "sav"
description = "Rouster SAV: SIB, validation-mode rule model, uRPF rule generation, SAV table manager, savd daemon"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
# SAVNET agent interface (repo AGENTS.md SAVNET rules): in-process
# hooks only — no wire protocols, no serialization, no sockets. Every
# draft the interface anticipates is expired or unstable, so the
# surface compiles only on explicit request and defaults OFF (see
# docs/protocols/savnet.md). Default-off also means the default
# workspace gate exercises none of it.
experimental-savnet = []

[dependencies]
common.workspace = true
rib.workspace = true
thiserror.workspace = true
tracing.workspace = true
# BAR-SAV (S9-a, draft-ietf-sidrops-bar-sav-10 §4/§8): the VRP/ASPA
# tables + the ROV/ASPA-verification functions the derivation's
# security preamble consumes. Pre-existing workspace member, path-only
# dependency (the bgpd→rpki precedent; the root workspace file is
# intentionally untouched — no new crates, no lock entries beyond
# sav's own edge list).
rpki = { path = "../rpki" }
# savd daemon wiring (W8): the ZAPI client (RIB view via redistribute
# pushes), the netlink backend (Dataplane installs + interface mirror),
# the async runtime, and log output. All pre-existing workspace members
# — no new crates, no lock-file changes; until W8 these were
# dev-dependencies of the W7 example only.
netlink-dp.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
zapi.workspace = true

[dev-dependencies]
# W5B property tests (ingest→query invariants) — dev-only, pinned in the
# workspace table; sav is its only consumer.
proptest.workspace = true
# A10 hysteresis tests: paused-clock time control (`start_paused`) needs
# tokio's test-util feature — dev-only, so the shipped daemon's tokio
# feature set is unchanged.
tokio = { workspace = true, features = ["test-util"] }
